# render.yaml — deploy backend as a Render Web Service
# Commit this to your repo root, then create service on render.com

services:
  - type: web
    name: f1-telemetry-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: FASTF1_CACHE
        value: /tmp/fastf1cache
    disk:
      name: fastf1-cache
      mountPath: /tmp/fastf1cache
      sizeGB: 2
    plan: free      # upgrade to starter ($7/mo) for persistent disk + no spin-down
    healthCheckPath: /
